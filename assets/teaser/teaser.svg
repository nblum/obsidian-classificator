<svg xmlns="http://www.w3.org/2000/svg" width="390" height="260" viewBox="0 0 390 260" font-family="Inter, 'Noto Sans', sans-serif">
  <!-- CI colors: blum-nico.de (sand-50 #f6f4ef, sand-200 #e3dfd6, sand-300 #d9d4c9,
       ink #1b1d1f, grey-700 #4a4a49, blue-600 #0f638e, brown-600 #856946) -->

  <!-- Background -->
  <rect width="390" height="260" fill="#f6f4ef"/>
  <rect x="0" y="0" width="390" height="4" fill="#0f638e"/>

  <!-- Eyebrow + title -->
  <text x="24" y="38" font-size="9.5" font-weight="600" style="-inkscape-font-specification:'Inter SemiBold'" letter-spacing="1.2" fill="#856946">OBSIDIAN PLUGIN</text>
  <text x="24" y="70" font-family="Sora, Inter, 'Noto Sans', sans-serif" font-size="30" font-weight="600" style="-inkscape-font-specification:'Sora SemiBold'" letter-spacing="-0.6" fill="#1b1d1f">Classificator</text>
  <text x="24" y="94" font-size="13" fill="#4a4a49">Classify notes. See it <tspan fill="#0f638e" font-weight="600" style="-inkscape-font-specification:'Inter SemiBold'">at a glance.</tspan></text>

  <!-- Tag mark -->
  <g transform="translate(326 24)">
    <rect width="40" height="40" rx="8" fill="#0f638e"/>
    <path d="M10.5 13.8 a3.2 3.2 0 0 1 3.2 -3.2 h8.8 l8.2 8.2 a2.5 2.5 0 0 1 0 3.5 l-8.4 8.4 a2.5 2.5 0 0 1 -3.5 0 l-8.3 -8.2 z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="17.2" cy="17.2" r="2.3" fill="#fff"/>
  </g>

  <!-- Note list (no window chrome) -->
  <line x1="24" y1="120" x2="366" y2="120" stroke="#1b1d1f" stroke-width="1.2"/>

  <g font-size="13" fill="#1b1d1f">
    <!-- row 1 -->
    <g transform="translate(24 120)">
      <path d="M2 11 h8 l4 4 v12 h-12 z M10 11 v4 h4" fill="none" stroke="#856946" stroke-width="1.3" stroke-linejoin="round"/>
      <text x="24" y="24">Release notes</text>
      <rect x="238" y="9" width="104" height="22" rx="11" fill="#ffffff" stroke="#2f7a4f" stroke-width="1.2"/>
      <circle cx="252" cy="20" r="3.5" fill="#2f7a4f"/>
      <text x="297" y="24.4" text-anchor="middle" font-size="11.5" font-weight="500" style="-inkscape-font-specification:'Inter Medium'" fill="#2f7a4f">public</text>
      <line x1="0" y1="40" x2="342" y2="40" stroke="#d9d4c9"/>
    </g>
    <!-- row 2 -->
    <g transform="translate(24 160)">
      <path d="M2 11 h8 l4 4 v12 h-12 z M10 11 v4 h4" fill="none" stroke="#856946" stroke-width="1.3" stroke-linejoin="round"/>
      <text x="24" y="24">Team playbook</text>
      <rect x="238" y="9" width="104" height="22" rx="11" fill="#ffffff" stroke="#0f638e" stroke-width="1.2"/>
      <circle cx="252" cy="20" r="3.5" fill="#0f638e"/>
      <text x="297" y="24.4" text-anchor="middle" font-size="11.5" font-weight="500" style="-inkscape-font-specification:'Inter Medium'" fill="#0f638e">internal</text>
      <line x1="0" y1="40" x2="342" y2="40" stroke="#d9d4c9"/>
    </g>
    <!-- row 3 -->
    <g transform="translate(24 200)">
      <path d="M2 11 h8 l4 4 v12 h-12 z M10 11 v4 h4" fill="none" stroke="#856946" stroke-width="1.3" stroke-linejoin="round"/>
      <text x="24" y="24">Salaries 2026</text>
      <rect x="238" y="9" width="104" height="22" rx="11" fill="#ffffff" stroke="#a8433a" stroke-width="1.2"/>
      <circle cx="252" cy="20" r="3.5" fill="#a8433a"/>
      <text x="297" y="24.4" text-anchor="middle" font-size="11.5" font-weight="500" style="-inkscape-font-specification:'Inter Medium'" fill="#a8433a">confidential</text>
    </g>
  </g>
</svg>
